[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowte"
version = "0.6.1"
description = "Local-first, AI-assisted knowledge workspace for turning sources into reviewed evidence, connected claims, and reusable wikis."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pypdf>=6.0,<7",
  "Pillow>=10,<12",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Knowte Contributors" }
]
keywords = ["research", "knowledge-management", "evidence", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.urls]
Homepage = "https://github.com/SeriaQ/Knowte"

[project.scripts]
knowte = "knowte.server:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "browser-extension", "browser-extension.*"]

[tool.setuptools.package-data]
knowte = [
  "prompts/*.md",
  "skills/*.md",
  "skills/*/SKILL.md",
  "skills/*/contract.json",
  "skills/*/examples/*.md",
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/*.png",
  "web/vendor/pdfjs/*.mjs",
  "web/vendor/pdfjs/LICENSE",
  "web/vendor/katex/*.js",
  "web/vendor/katex/LICENSE",
  "web/vendor/pdfjs/cmaps/*",
  "web/vendor/pdfjs/standard_fonts/*",
]

[tool.setuptools.data-files]
"knowte/browser-extension" = [
  "browser-extension/manifest.json",
  "browser-extension/background.js",
  "browser-extension/content.js",
  "browser-extension/popup.html",
  "browser-extension/popup.js",
  "browser-extension/popup.css",
  "browser-extension/knowte_icon.png",
  "browser-extension/README.md",
]
